<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ephemeral Chat</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Configuração do app -->
  <script src="config.js"></script>
  <!-- Socket.IO client (CDN para funcionar tanto na web quanto no app nativo) -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <!-- Google Fonts - Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">

    <!-- ======================================================== -->
    <!-- Tela de Login Simples -->
    <!-- ======================================================== -->
    <div id="login-screen" class="screen active">
      <div class="login-container">
        <div class="login-logo">
          <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
            <circle cx="32" cy="32" r="30" stroke="url(#grad)" stroke-width="2" fill="none"/>
            <path d="M20 28C20 24.6863 22.6863 22 26 22H38C41.3137 22 44 24.6863 44 28V34C44 37.3137 41.3137 40 38 40H34L28 44V40H26C22.6863 40 20 37.3137 20 34V28Z" fill="url(#grad)"/>
            <defs>
              <linearGradient id="grad" x1="0" y1="0" x2="64" y2="64">
                <stop offset="0%" stop-color="#8B5CF6"/>
                <stop offset="100%" stop-color="#06B6D4"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1 class="login-title">Ephemeral</h1>
        <p class="login-subtitle">Mensagens que desaparecem. Privacidade absoluta.</p>
        
        <div class="login-form">
          <div class="input-group">
            <input type="text" id="username-input" placeholder="Seu nome" maxlength="20" autocomplete="off">
          </div>
          <button id="login-btn" class="btn-primary" disabled>Entrar</button>
        </div>

        <p class="login-footer">As mensagens desaparecem em 3 segundos.<br>Sem rastros. Sem histórico.</p>
      </div>
    </div>

    <!-- ======================================================== -->
    <!-- Tela de Contatos -->
    <!-- ======================================================== -->
    <div id="contacts-screen" class="screen">
      <header class="contacts-header">
        <div class="header-left">
          <div class="user-avatar" id="my-avatar"></div>
          <div class="header-info">
            <h2 id="my-username">Usuário</h2>
            <span class="status-text online">Online</span>
          </div>
        </div>
        <div class="header-right">
          <button id="logout-btn" class="btn-icon" title="Sair">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="contacts-list">
        <div class="contacts-section-title">Conversas</div>
        <!-- Os contatos serão inseridos aqui via JS -->
        <div id="contacts-container"></div>
      </div>
    </div>

    <!-- ======================================================== -->
    <!-- Tela de Chat -->
    <!-- ======================================================== -->
    <div id="chat-screen" class="screen">
      <header class="chat-header">
        <button id="back-btn" class="btn-icon" title="Voltar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <div class="chat-header-info">
          <div class="contact-avatar" id="chat-avatar"></div>
          <div class="chat-header-text">
            <h3 id="chat-contact-name">Contato</h3>
            <span id="chat-contact-status" class="status-text">offline</span>
          </div>
        </div>
      </header>

      <!-- Área de mensagens -->
      <div id="messages-container" class="messages-area">
        <div id="messages-list"></div>
        <!-- Indicador de digitando -->
        <div id="typing-indicator" class="typing-indicator hidden">
          <div class="typing-dots">
            <span></span><span></span><span></span>
          </div>
          <span class="typing-text">digitando...</span>
        </div>
      </div>

      <!-- Aviso de privacidade -->
      <div class="privacy-notice">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <span>Mensagens desaparecem em 3s</span>
      </div>

      <!-- Área de input -->
      <div class="chat-input-area">
        <div class="input-wrapper">
          <input type="text" id="message-input" placeholder="Digite uma mensagem..." autocomplete="off">
        </div>
        <button id="send-btn" class="btn-send" disabled title="Enviar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>

  </div>

  <!-- Template de mensagem -->
  <template id="message-template">
    <div class="message-bubble">
      <div class="message-content"></div>
      <div class="message-meta">
        <span class="message-status"></span>
        <span class="message-timer"></span>
      </div>
      <div class="timer-bar">
        <div class="timer-bar-fill"></div>
      </div>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
